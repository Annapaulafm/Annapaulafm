<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="360" rx="18"/>
    </clipPath>

    <linearGradient id="textFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8f5"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="360" fill="url(#bgBase)"/>

    <g filter="url(#blurHeavy)">
      <circle cx="150" cy="100" r="190" fill="url(#blob1)">
        <animate attributeName="cx" values="150;420;150" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="100;260;100" dur="11s" repeatCount="indefinite"/>
      </circle>

      <circle cx="950" cy="70" r="210" fill="url(#blob2)">
        <animate attributeName="cx" values="950;700;950" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;240;70" dur="16s" repeatCount="indefinite"/>
      </circle>

      <circle cx="600" cy="300" r="230" fill="url(#blob3)">
        <animate attributeName="cx" values="600;300;900;600" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="300;120;300" dur="15s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1050" cy="280" r="160" fill="url(#blob4)">
        <animate attributeName="cx" values="1050;800;1050" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="280;120;280" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0" y="0" width="1200" height="360" fill="#0a0e17" opacity="0.28"/>

    <text x="600" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="74" font-weight="800"
          fill="url(#textFade)" text-anchor="middle">
      I'm Ana Paula
    </text>

    <text x="600" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="22" letter-spacing="5"
          fill="#ffd1e8" text-anchor="middle" opacity="0.9">
      COMPUTER SCIENCE STUDENT
    </text>

    <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#2a2f3a" stroke-width="1"/>
  </g>
</svg>
