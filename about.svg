<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="340" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="340" fill="url(#bgBase)"/>

    <g filter="url(#blurHeavy)">
      <circle cx="120" cy="60" r="170" fill="url(#blob1)">
        <animate attributeName="cx" values="120;380;120" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;220;60" dur="12s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1000" cy="280" r="190" fill="url(#blob2)">
        <animate attributeName="cx" values="1000;750;1000" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="280;100;280" dur="17s" repeatCount="indefinite"/>
      </circle>

      <circle cx="600" cy="330" r="210" fill="url(#blob3)">
        <animate attributeName="cx" values="600;300;900;600" dur="19s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="330;150;330" dur="16s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1050" cy="30" r="140" fill="url(#blob4)">
        <animate attributeName="cx" values="1050;800;1050" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="30;150;30" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0" y="0" width="1200" height="340" fill="#0a0e17" opacity="0.45"/>

    <text x="80" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800"
          fill="#ffd1e8">
      🎀 About Me
    </text>

    <line x1="80" y1="100" x2="1120" y2="100" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

    <text x="90" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#f2f2f7">
      👋&#160;&#160;Brazilian girl from Minas Gerais
    </text>

    <text x="90" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#f2f2f7">
      💻&#160;&#160;Computer Science @ Universidade Federal de Viçosa
    </text>

    <text x="90" y="275" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#f2f2f7">
      🎯&#160;&#160;Interests: Full-Stack&#160;&#160;•&#160;&#160;Data Science&#160;&#160;•&#160;&#160;Software Engineering&#160;&#160;•&#160;&#160;AI
    </text>

    <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#2a2f3a" stroke-width="1"/>
  </g>
</svg>
