<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bgBase)"/>

    <g filter="url(#blurHeavy)">
      <circle cx="150" cy="60" r="170" fill="url(#blob1)">
        <animate attributeName="cx" values="150;420;150" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;220;60" dur="11s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1000" cy="250" r="190" fill="url(#blob2)">
        <animate attributeName="cx" values="1000;750;1000" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;80;250" dur="16s" repeatCount="indefinite"/>
      </circle>

      <circle cx="600" cy="280" r="200" fill="url(#blob3)">
        <animate attributeName="cx" values="600;300;900;600" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="280;100;280" dur="15s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1050" cy="30" r="140" fill="url(#blob4)">
        <animate attributeName="cx" values="1050;800;1050" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="30;150;30" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

